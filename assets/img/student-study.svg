  <g>
    <rect x="52" y="178" width="70" height="18" rx="4" fill="#0057B8"/>
    <rect x="58" y="162" width="60" height="16" rx="4" fill="#fff"/>
    <rect x="64" y="148" width="50" height="14" rx="4" fill="#00A651"/>
    <rect x="70" y="153" width="24" height="4" rx="2" fill="#fff" opacity=".8"/>
  </g>
  <!-- child: body -->
  <rect x="140" y="130" width="84" height="68" rx="30" fill="#00A651"/>
  <rect x="140" y="170" width="84" height="28" fill="#00A651"/>
  <path d="M168 130 Q182 148 196 130" fill="#fff" opacity=".9"/>
