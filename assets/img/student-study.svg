  <circle cx="146" cy="90" r="8" fill="#F4C7A1"/><circle cx="218" cy="90" r="8" fill="#F4C7A1"/>
  <!-- hair -->
  <path d="M146 84 C142 50 170 40 186 44 C206 40 224 58 218 84 C210 70 196 64 182 66 C166 66 154 72 146 84 Z" fill="#2B1B12"/>
  <path d="M170 50 C176 38 196 36 204 46" fill="none" stroke="#2B1B12" stroke-width="8" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="168" cy="90" r="4.5" fill="#0B0F14"/><circle cx="196" cy="90" r="4.5" fill="#0B0F14"/>
  <circle cx="169.5" cy="88.5" r="1.4" fill="#fff"/><circle cx="197.5" cy="88.5" r="1.4" fill="#fff"/>
  <circle cx="160" cy="102" r="6" fill="#F28B82" opacity=".45"/><circle cx="204" cy="102" r="6" fill="#F28B82" opacity=".45"/>
  <path d="M174 104 Q182 112 190 104" fill="none" stroke="#7A3E2B" stroke-width="3" stroke-linecap="round"/>
  <!-- open book -->
  <path d="M132 192 L182 182 L232 192 L232 176 L182 166 L132 176 Z" fill="#fff"/>
  <path d="M182 166 V182" stroke="#C5CED8" stroke-width="2"/>
  <g stroke="#0057B8" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M142 177 L172 171"/><path d="M142 184 L172 178"/><path d="M192 171 L222 177"/><path d="M192 178 L222 184"/></g>
  <!-- arms -->
  <path d="M152 148 Q138 170 160 180" fill="none" stroke="#00A651" stroke-width="18" stroke-linecap="round"/>
  <path d="M212 148 Q226 170 204 180" fill="none" stroke="#00A651" stroke-width="18" stroke-linecap="round"/>
  <circle cx="162" cy="181" r="8" fill="#F4C7A1"/><circle cx="202" cy="181" r="8" fill="#F4C7A1"/>
  <!-- pencil -->
  <g transform="rotate(-28 204 176)"><rect x="198" y="158" width="7" height="30" rx="2" fill="#FFD25E"/><polygon points="198,188 205,188 201.5,196" fill="#F4C7A1"/><polygon points="200,193 203,193 201.5,196" fill="#0B0F14"/><rect x="198" y="154" width="7" height="6" rx="2" fill="#F28B82"/></g>
