<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-label="A child studying at a desk">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- soft background -->
  <circle cx="190" cy="120" r="112" fill="#fff" opacity=".07"/>
  <circle cx="300" cy="50" r="38" fill="#00A651" opacity=".35"/>
  <circle cx="40" cy="190" r="30" fill="#0057B8" opacity=".5"/>
  <!-- floating bits -->
  <g>
    <rect x="36" y="46" width="62" height="38" rx="19" fill="#00A651"/>
    <text x="67" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#fff">A+</text>
    <polygon points="318,112 323,126 338,127 326,136 330,150 318,142 306,150 310,136 298,127 313,126" fill="#FFD25E"/>
    <polygon points="62,128 65,136 74,137 67,142 69,151 62,146 55,151 57,142 50,137 59,136" fill="#FFD25E" opacity=".85"/>
  </g>
  <!-- lamp glow + lamp -->
  <circle cx="288" cy="120" r="62" fill="url(#glow)"/>
  <g>
    <rect x="266" y="196" width="46" height="8" rx="4" fill="#0B0F14"/>
    <path d="M289 196 V150 L262 112" stroke="#0B0F14" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M238 100 L274 92 L282 122 L246 128 Z" fill="#00A651"/>
    <circle cx="250" cy="116" r="5" fill="#FFF3C4"/>
