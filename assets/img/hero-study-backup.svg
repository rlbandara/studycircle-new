<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Students studying together">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B3D91"/><stop offset="1" stop-color="#0057B8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A651"/><stop offset="1" stop-color="#00873F"/></linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="#0B0F14"/>
  <circle cx="540" cy="70" r="150" fill="#0057B8" opacity=".35"/>
  <circle cx="90" cy="430" r="170" fill="#00A651" opacity=".25"/>
  <!-- campus building -->
  <g transform="translate(60 250)">
    <rect x="0" y="40" width="300" height="130" rx="6" fill="#fff"/>
    <rect x="0" y="20" width="300" height="26" rx="6" fill="url(#g1)"/>
    <polygon points="150,-20 320,26 -20,26" fill="url(#g2)"/>
    <g fill="#0057B8" opacity=".9">
      <rect x="22" y="64" width="34" height="52" rx="4"/><rect x="74" y="64" width="34" height="52" rx="4"/>
      <rect x="192" y="64" width="34" height="52" rx="4"/><rect x="244" y="64" width="34" height="52" rx="4"/>
    </g>
    <rect x="126" y="86" width="48" height="84" rx="6" fill="#0B0F14"/>
    <circle cx="150" cy="4" r="9" fill="#fff"/>
  </g>
  <!-- laptop -->
  <g transform="translate(330 120)">
    <rect x="0" y="0" width="240" height="150" rx="12" fill="#fff"/>
    <rect x="12" y="12" width="216" height="126" rx="6" fill="#0B0F14"/>
    <rect x="28" y="30" width="110" height="10" rx="5" fill="#00A651"/>
    <rect x="28" y="52" width="170" height="8" rx="4" fill="#fff" opacity=".7"/>
    <rect x="28" y="68" width="150" height="8" rx="4" fill="#fff" opacity=".45"/>
    <rect x="28" y="92" width="64" height="26" rx="13" fill="#0057B8"/>
    <rect x="-20" y="150" width="280" height="14" rx="7" fill="#e5e9ee"/>
  </g>
  <!-- book stack -->
  <g transform="translate(400 330)">
    <rect x="0" y="40" width="180" height="26" rx="6" fill="#00A651"/>
    <rect x="12" y="14" width="156" height="26" rx="6" fill="#0057B8"/>
    <rect x="24" y="-12" width="132" height="26" rx="6" fill="#fff"/>
    <rect x="40" y="-3" width="60" height="8" rx="4" fill="#0B0F14" opacity=".8"/>
  </g>
  <!-- chat bubbles -->
  <g>
    <rect x="470" y="40" width="130" height="46" rx="23" fill="#00A651"/>
    <circle cx="500" cy="63" r="6" fill="#fff"/><circle cx="522" cy="63" r="6" fill="#fff"/><circle cx="544" cy="63" r="6" fill="#fff"/>
    <polygon points="486,84 482,102 504,86" fill="#00A651"/>
  </g>
</svg>
