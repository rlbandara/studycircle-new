<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Students sharing notes and studying together" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B3F"/><stop offset=".6" stop-color="#0A3E8C"/><stop offset="1" stop-color="#0B6B5A"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#D5DEEA"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B3A" stop-opacity=".75"/><stop offset="1" stop-color="#0B1B3A" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00D26A" stop-opacity=".55"/><stop offset="1" stop-color="#00D26A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" opacity=".14"/>
    </pattern>
    <clipPath id="card"><rect width="640" height="480" rx="28"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="640" height="480" fill="url(#bg)"/>
    <rect width="640" height="480" fill="url(#dots)"/>
    <circle cx="560" cy="40" r="170" fill="#1E7BFF" opacity=".28"/>
    <circle cx="70" cy="470" r="200" fill="url(#glow)"/>
    <circle cx="320" cy="250" r="150" fill="#fff" opacity=".05"/>

    <!-- dashed links between people and shared items -->
    <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round">
      <path d="M130 200 C 120 170, 110 160, 100 145"/>
      <path d="M320 186 C 320 170, 320 160, 320 152"/>
      <path d="M510 200 C 520 160, 530 130, 530 112"/>
    </g>

    <!-- floating: group chip -->
    <g filter="url(#sh)">
      <rect x="34" y="92" width="150" height="50" rx="25" fill="#fff"/>
      <circle cx="64" cy="117" r="14" fill="#F2C9A0" stroke="#fff" stroke-width="3"/>
      <circle cx="86" cy="117" r="14" fill="#8D5A3B" stroke="#fff" stroke-width="3"/>
      <circle cx="108" cy="117" r="14" fill="#D9A27A" stroke="#fff" stroke-width="3"/>
      <rect x="130" y="108" width="42" height="9" rx="4.5" fill="#0B1B3A"/>
      <rect x="130" y="122" width="28" height="7" rx="3.5" fill="#00A651"/>
    </g>

    <!-- floating: shared notes card -->
    <g transform="rotate(-3 320 95)" filter="url(#sh)">
      <rect x="210" y="34" width="230" height="118" rx="16" fill="#fff"/>
      <rect x="210" y="34" width="230" height="30" rx="16" fill="#0057B8"/>
      <rect x="210" y="48" width="230" height="16" fill="#0057B8"/>
      <circle cx="228" cy="49" r="4" fill="#fff" opacity=".9"/><circle cx="242" cy="49" r="4" fill="#fff" opacity=".6"/><circle cx="256" cy="49" r="4" fill="#fff" opacity=".35"/>
      <rect x="226" y="76" width="38" height="26" rx="6" fill="#00A651"/>
      <text x="245" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff">PDF</text>
      <rect x="274" y="78" width="120" height="9" rx="4.5" fill="#0B1B3A"/>
      <rect x="274" y="94" width="86" height="7" rx="3.5" fill="#9AA8BC"/>
      <rect x="226" y="114" width="188" height="6" rx="3" fill="#D5DEEA"/>
      <rect x="226" y="126" width="140" height="6" rx="3" fill="#D5DEEA"/>
      <rect x="372" y="122" width="52" height="20" rx="10" fill="#00A651"/>
      <path d="M392 128 v6 m-3 -3 l3 3 l3 -3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- floating: chat bubble -->
    <g filter="url(#sh)">
      <rect x="470" y="60" width="130" height="52" rx="26" fill="#00A651"/>
      <polygon points="514,108 508,128 534,110" fill="#00A651"/>
      <circle cx="510" cy="86" r="6" fill="#fff"/><circle cx="535" cy="86" r="6" fill="#fff"/><circle cx="560" cy="86" r="6" fill="#fff"/>
    </g>

    <!-- floating: answered badge -->
    <g filter="url(#sh)">
      <circle cx="458" cy="168" r="20" fill="#fff"/>
      <path d="M449 168 l6 6 l12 -13" stroke="#00A651" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- sparkles -->
    <g fill="#fff">
      <path d="M600 190 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z" opacity=".8"/>
      <path d="M30 220 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z" opacity=".6"/>
      <circle cx="190" cy="30" r="3" opacity=".5"/><circle cx="600" cy="150" r="2.5" opacity=".5"/>
    </g>

    <!-- plant (left) -->
    <g>
      <path d="M52 338 C 30 300, 34 270, 58 252 C 66 280, 66 310, 52 338z" fill="#00A651"/>
      <path d="M58 338 C 74 306, 92 296, 110 296 C 100 320, 84 334, 58 338z" fill="#00873F"/>
      <path d="M52 338 C 48 312, 40 296, 24 290 C 22 312, 34 330, 52 338z" fill="#2ED47A"/>
    </g>

    <!-- student A (left) -->
    <g>
      <path d="M92 345 V300 Q92 270 124 268 H138 Q170 270 170 300 V345z" fill="#00A651"/>
      <path d="M118 268 Q131 286 144 268z" fill="#00873F"/>
      <rect x="123" y="246" width="16" height="24" rx="7" fill="#E9B88C"/>
      <circle cx="131" cy="232" r="29" fill="#F2C9A0"/>
      <path d="M102 230 Q100 196 134 198 Q166 198 160 232 Q150 214 132 214 Q112 214 102 230z" fill="#2B1B12"/>
      <circle cx="121" cy="236" r="3" fill="#2B1B12"/><circle cx="142" cy="236" r="3" fill="#2B1B12"/>
      <path d="M122 247 Q131 254 141 247" stroke="#9B5B3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="114" cy="245" r="4" fill="#F29A8A" opacity=".5"/><circle cx="148" cy="245" r="4" fill="#F29A8A" opacity=".5"/>
    </g>

    <!-- student C (right) -->
    <g>
      <path d="M476 345 V302 Q476 272 508 270 H522 Q554 272 554 302 V345z" fill="#F5B83D"/>
      <path d="M502 270 Q515 288 528 270z" fill="#D99A1E"/>
      <path d="M476 236 Q470 196 514 196 Q558 196 552 236 L556 292 Q536 300 530 280 L498 280 Q492 300 472 292z" fill="#1A1A2E"/>
      <rect x="507" y="248" width="16" height="24" rx="7" fill="#C28C63"/>
      <circle cx="515" cy="234" r="28" fill="#D9A27A"/>
      <path d="M488 230 Q490 204 516 204 Q542 204 542 230 Q530 214 514 216 Q498 216 488 230z" fill="#1A1A2E"/>
      <circle cx="505" cy="238" r="3" fill="#1A1A2E"/><circle cx="526" cy="238" r="3" fill="#1A1A2E"/>
      <path d="M506 249 Q515 256 525 249" stroke="#8A4B33" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="498" cy="247" r="4" fill="#F29A8A" opacity=".5"/><circle cx="532" cy="247" r="4" fill="#F29A8A" opacity=".5"/>
    </g>

    <!-- student B (center) -->
    <g>
      <path d="M268 345 V292 Q268 258 304 256 H336 Q372 258 372 292 V345z" fill="#fff"/>
      <path d="M300 256 L320 288 L340 256z" fill="#0057B8"/>
      <rect x="311" y="232" width="18" height="28" rx="8" fill="#764628"/>
      <circle cx="320" cy="218" r="31" fill="#8D5A3B"/>
      <path d="M288 214 Q286 180 322 182 Q356 182 352 214 Q342 196 320 196 Q298 196 288 214z" fill="#120C08"/>
      <circle cx="320" cy="180" r="13" fill="#120C08"/>
      <circle cx="308" cy="222" r="3" fill="#120C08"/><circle cx="332" cy="222" r="3" fill="#120C08"/>
      <g fill="none" stroke="#0B1B3A" stroke-width="2.5"><circle cx="308" cy="222" r="9"/><circle cx="332" cy="222" r="9"/><path d="M317 222 H323"/></g>
      <path d="M310 236 Q320 245 331 236" stroke="#4E2A14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- desk -->
    <rect x="20" y="338" width="600" height="22" rx="11" fill="url(#desk)"/>
    <rect x="44" y="360" width="552" height="130" fill="url(#front)"/>

    <!-- hands on desk -->
    <ellipse cx="108" cy="338" rx="12" ry="8" fill="#F2C9A0"/>
    <ellipse cx="492" cy="338" rx="12" ry="8" fill="#D9A27A"/>

    <!-- laptop (back view, facing students) -->
    <g filter="url(#sh)">
      <rect x="262" y="292" width="116" height="48" rx="7" fill="#C9D3E1"/>
      <circle cx="320" cy="316" r="7" fill="#fff" opacity=".85"/>
      <circle cx="320" cy="316" r="3.5" fill="#00A651"/>
      <rect x="250" y="338" width="140" height="8" rx="4" fill="#9AA8BC"/>
    </g>

    <!-- open notebook -->
    <g filter="url(#sh)">
      <path d="M170 336 L215 328 L260 336 L215 345z" fill="#fff"/>
      <path d="M180 336 L215 331 M200 339 L228 334" stroke="#9AA8BC" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- book stack -->
    <g filter="url(#sh)">
      <rect x="395" y="326" width="76" height="14" rx="4" fill="#00A651"/>
      <rect x="401" y="312" width="64" height="14" rx="4" fill="#0057B8"/>
      <rect x="407" y="298" width="52" height="14" rx="4" fill="#fff"/>
      <rect x="415" y="303" width="22" height="4" rx="2" fill="#0B1B3A" opacity=".8"/>
    </g>

    <!-- mug -->
    <g>
      <rect x="560" y="312" width="28" height="28" rx="6" fill="#fff"/>
      <path d="M588 320 q12 0 12 9 q0 9 -12 9" fill="none" stroke="#fff" stroke-width="4"/>
      <rect x="560" y="312" width="28" height="8" rx="4" fill="#E8EEF7"/>
      <path d="M568 304 q-4 -6 0 -10 M578 304 q-4 -6 0 -10" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
